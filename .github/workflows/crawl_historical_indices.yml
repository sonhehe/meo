name: Crawl historical indices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: TVS/CRAWL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TVS/CRAWL/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python crawl_his_indices.py
      - name: Save crawled data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TVS/CRAWL/raw_historical_indices.xlsx
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "Update historical index data"
            git push
          fi
